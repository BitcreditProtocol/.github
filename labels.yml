# Canonical label set for every BitcreditProtocol repository.
#
# Applied by .github/workflows/sync-labels.yml, which enumerates non-archived
# repositories from the API on every run — a new repository is picked up
# automatically and an archived one drops out. There is deliberately no
# hardcoded list of repositories anywhere.
#
# The sync never deletes labels. Deleting a label strips it from every issue
# and pull request that carries it, irreversibly. Labels found in a repository
# but absent from this file are listed in the job summary, not removed.
#
# `description` is optional. Omit it to pin only the colour and leave whatever
# description the repository already has.

# Old name -> new name. Applied first, and only when the old label exists and
# the new one does not. Renaming preserves every existing issue and pull
# request assignment.
renames:
  improvments: improvements
  Design: design
  devOps: devops
  good first contribution: good first issue
  github_actions: github-actions

# Created in every repository, and corrected if colour or description drift.
# Limited to the labels GitHub itself creates with every new repository, so
# nothing unused is pushed anywhere.
required:
  - name: bug
    color: 'd73a4a'
    description: Something isn't working
  - name: documentation
    color: '0075ca'
    description: Improvements or additions to documentation
  - name: duplicate
    color: 'cfd3d7'
    description: This issue or pull request already exists
  - name: enhancement
    color: 'a2eeef'
    description: New feature or request
  - name: good first issue
    color: '7057ff'
    description: Good for newcomers
  - name: help wanted
    color: '008672'
    description: Extra attention is needed
  - name: invalid
    color: 'e4e669'
    description: This doesn't seem right
  - name: question
    color: 'd876e3'
    description: Further information is requested
  - name: wontfix
    color: 'ffffff'
    description: This will not be worked on

# Corrected where present. Created only in a repository whose own
# .github/dependabot.yml asks for the label — never pushed everywhere, since
# these are repository-specific and a Flutter repository has no use for `rust`.
#
# The creation rule exists because Dependabot applies only labels that already
# exist and silently drops the rest: a configuration asking for a label the
# repository lacks produces unlabelled pull requests, with nothing anywhere
# reporting it.
managed:
  - name: dependencies
    color: 'AD07B5'
    description: Pull request that updates dependencies
  - name: github-actions
    color: '1f0657'
    description: Pull request that updates GitHub Actions

  # cross-cutting, used by some teams
  - name: blocked
    color: 'b60205'
    description: Blocked by other work that needs to be done first
  - name: design
    color: '2f7496'
    description: Design work
  - name: improvements
    color: '82cb3f'
    description: Improvement of existing code
  - name: devops
    color: 'fbca04'
    description: DevOps tasks
  - name: devtools
    color: '798EC1'
    description: Related to development tooling
  - name: breaking
    color: '892627'
    description: Breaking change
  - name: i18n
    color: 'c2e0c6'
    description: Internationalization
  - name: staff only
    color: '2D024A'
    description: Requires infrastructure access or institutional knowledge
  - name: ui library
    color: 'faf3d2'
    description: Related to the shared UI library
  - name: awaiting triage
    color: '628E85'
    description: Has not been triaged by a maintainer
  - name: ticket work required
    color: '6E58CA'
    description: Needs additional work before it is ready to be taken up

  # Dependabot ecosystem labels, recorded at their current values so the sync
  # pins them without changing anything today. `rust` is Dependabot's default
  # black; worth picking a real colour, but that is a decision, not a fix.
  - name: rust
    color: '000000'
  - name: javascript
    color: '168700'
  - name: npm
    color: '8ca81b'
  - name: ruby
    color: 'ce2d2d'
  - name: dart
    color: '00B4AB'
    description: Pull request that updates Dart dependencies
  - name: terraform
    color: '7B42BC'
    description: Pull request that updates Terraform dependencies

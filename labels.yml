# Canonical label set for every BitcreditProtocol repository.
#
# Applied by .github/workflows/sync-labels.yml, which enumerates non-archived
# repositories from the API on every run — a new repository is picked up
# automatically and an archived one drops out. There is deliberately no
# hardcoded list of repositories anywhere.
#
# The sync never deletes labels. Deleting a label strips it from every issue
# and pull request that carries it, irreversibly. Labels found in a repository
# but absent from this file are listed in the job summary, not removed.
#
# `description` is optional. Omit it to pin only the colour and leave whatever
# description the repository already has.

# Old name -> new name. Applied first, and only when the old label exists and
# the new one does not. Renaming preserves every existing issue and pull
# request assignment.
renames:
  improvments: improvements
  Design: design
  devOps: devops
  good first contribution: good first issue
  github_actions: github-actions

# Created in every repository, and corrected if colour or description drift.
#
# Two groups: the nine labels GitHub itself creates, and every label a
# .github/dependabot.yml can ask for. The second group is here rather than under
# `managed` because Dependabot applies only labels that already exist and
# silently drops the rest — a configuration naming a label the repository lacks
# produces unlabelled pull requests and, worse, an "the following labels could
# not be found" error that stops the update. Deriving them per repository from
# its own configuration was tried and is strictly weaker: it leaves the set
# uneven, so adding an ecosystem to a repository silently needs a label run
# before it works. Owner decision 2026-08-25: uniform everywhere, and an unused
# label costs nothing next to a broken Dependabot run.
required:
  - name: bug
    color: 'd73a4a'
    description: Something isn't working
  - name: documentation
    color: '0075ca'
    description: Improvements or additions to documentation
  - name: duplicate
    color: 'cfd3d7'
    description: This issue or pull request already exists
  - name: enhancement
    color: 'a2eeef'
    description: New feature or request
  - name: good first issue
    color: '7057ff'
    description: Good for newcomers
  - name: help wanted
    color: '008672'
    description: Extra attention is needed
  - name: invalid
    color: 'e4e669'
    description: This doesn't seem right
  - name: question
    color: 'd876e3'
    description: Further information is requested
  - name: wontfix
    color: 'ffffff'
    description: This will not be worked on

  # Every label a dependabot.yml can request. `rust`, `npm` and `ruby` keep the
  # colours Dependabot itself assigned and carry no description, so the sync pins
  # the colour and leaves whatever description a repository already has.
  - name: dependencies
    color: 'AD07B5'
    description: Pull request that updates dependencies
  - name: github-actions
    color: '1f0657'
    description: Pull request that updates GitHub Actions
  - name: npm
    color: '8ca81b'
  - name: rust
    color: '000000'
  - name: dart
    color: '00B4AB'
    description: Pull request that updates Dart dependencies
  - name: ruby
    color: 'ce2d2d'
  - name: terraform
    color: '7B42BC'
    description: Pull request that updates Terraform dependencies
  - name: docker
    color: '2496ED'
    description: Pull request that updates Docker dependencies

  # Requested by an issue template rather than by a dependabot.yml, and the
  # argument is the same one. `Governance`'s proposal form applies this on
  # creation, which is what lets anyone open a proposal without holding the
  # permission to label it — a contributor with read access cannot apply a label
  # by hand. A label a template asks for and the repository lacks is dropped in
  # silence, so the flow would look like it worked and would not have.
  - name: awaiting triage
    color: '628E85'
    description: Has not been triaged by a maintainer

  # A release note has to be able to say that something broke. Owner decision
  # 2026-09-01: breaking changes are marked with this label rather than with a
  # conventional-commit `!`, which would displace a commit convention sitting at
  # 10% adoption. Moved here from `managed` the same day: it was defined but
  # created nowhere, so it existed in 1 repository of 29 and the convention had
  # nothing to attach to.
  - name: breaking
    color: '892627'
    description: Breaking change

# Corrected where present, never created. Team workflow labels: which of these a
# repository wants is that team's business, and pushing them everywhere would add
# labels nobody uses. Anything a configuration can request — a dependabot.yml or
# an issue template — is in `required` above instead, because a missing one
# breaks that configuration rather than merely looking untidy. So is anything a
# convention obliges someone to apply, for the same reason: `breaking` was here
# and could not be used, because it existed in one repository.
managed:

  # cross-cutting, used by some teams
  - name: blocked
    color: 'b60205'
    description: Blocked by other work that needs to be done first
  - name: design
    color: '2f7496'
    description: Design work
  - name: improvements
    color: '82cb3f'
    description: Improvement of existing code
  - name: devops
    color: 'fbca04'
    description: DevOps tasks
  - name: devtools
    color: '798EC1'
    description: Related to development tooling
  - name: i18n
    color: 'c2e0c6'
    description: Internationalization
  - name: staff only
    color: '2D024A'
    description: Requires infrastructure access or institutional knowledge
  - name: ui library
    color: 'faf3d2'
    description: Related to the shared UI library
  - name: ticket work required
    color: '6E58CA'
    description: Needs additional work before it is ready to be taken up

  # A language label rather than a Dependabot ecosystem — nothing requests it in a
  # dependabot.yml, so it stays here.
  - name: javascript
    color: '168700'

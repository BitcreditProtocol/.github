name: Sync labels

# Reconciles every non-archived repository in the organisation against
# labels.yml. Repositories are discovered from the API, so adding or archiving
# one needs no change here.

on:
  pull_request:
    paths:
      - '.github/scripts/sync-labels.sh'
      - '.github/scripts/test_sync_labels.py'
      - '.github/workflows/sync-labels.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without writing anything
        type: boolean
        default: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/test_sync_labels.py

  sync:
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint an org-scoped token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Reconcile labels
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/sync-labels.sh

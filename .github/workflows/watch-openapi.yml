name: Watch Wildcat OpenAPI

on:
  pull_request:
    paths:
      - '.github/scripts/watch-openapi.py'
      - '.github/scripts/test_openapi_watch.py'
      - '.github/workflows/watch-openapi.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare the current specifications without changing an issue
        type: boolean
        default: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/test_openapi_watch.py

  watch:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: watch-openapi
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the source artifact and dashboard baseline
        id: read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            Wildcat
            wildcat-dashboard-ui
          permission-actions: read
          permission-contents: read
          permission-metadata: read
          permission-issues: read
      - name: Scope issue changes to the dashboard
        id: write
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wildcat-dashboard-ui
          permission-metadata: read
          permission-issues: ${{ env.DRY_RUN == 'true' && 'read' || 'write' }}
      - name: Compare exact source snapshots
        env:
          READ_TOKEN: ${{ steps.read.outputs.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
          ORG: ${{ github.repository_owner }}
          WATCHER_BOT: ${{ steps.write.outputs.app-slug }}[bot]
        run: python3 .github/scripts/watch-openapi.py

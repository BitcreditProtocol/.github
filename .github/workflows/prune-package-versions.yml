name: Prune package versions

# Reports container package versions that nothing references any more. Packages
# are discovered from the API on every run, so a new one is covered without any
# change here.
#
# The schedule NEVER deletes. Deleting a version cannot be undone and the image
# cannot be rebuilt by hand, so removal needs a manual run with dry_run unticked.

on:
  schedule:
    - cron: '37 6 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be deleted without deleting anything
        type: boolean
        default: true
      keep_days:
        description: Keep every version newer than this many days, whatever its tags
        type: string
        default: '30'
      only_package:
        description: Restrict to a single package, for a first careful run
        type: string
        default: ''

permissions: {}

jobs:
  prune:
    # A bound, not a measurement: the job has never got past its first API call,
    # so there is nothing to derive one from. It will walk 3,409 container
    # versions once organisation `Packages: read` is granted, and gets measured
    # on that run. A job with no timeout at all runs to GitHub's six-hour
    # default -- and the audit next door was cancelled today by a value set too
    # tight, so this errs the other way.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint an org-scoped token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Report unreferenced package versions
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          # Gated on the event, not on the input alone. GitHub coerces both sides
          # of == to a number, and on a schedule `inputs` is empty: null -> 0 and
          # false -> 0, so `inputs.dry_run == false` is TRUE and every scheduled
          # run would delete. The script refuses a second time on GITHUB_EVENT_NAME.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) && 'false' || 'true' }}
          KEEP_DAYS: ${{ inputs.keep_days || '30' }}
          ONLY_PACKAGE: ${{ inputs.only_package || '' }}
        run: bash .github/scripts/prune-package-versions.sh

name: Audit repository settings

# Reports configuration drift across every non-archived repository and keeps
# the organisation topics in place. Everything else is reported, not applied.

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report without writing topics
        type: boolean
        default: false

permissions: {}

jobs:
  audit:
    # Measured, not guessed: the first run with every check able to read its
    # input took 19m17s (11:30:05 -> 11:49:22 on 2026-09-02). The previous value
    # of 15 was set while six checks were being skipped for want of permission,
    # and the first full-sight run was cancelled at exactly 15m00s with no
    # report written at all. 30 leaves half again as much headroom on a job
    # that runs once a week.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint an org-scoped token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Audit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          BASELINE_CONFIG: Bitcredit baseline
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/audit-repo-settings.sh

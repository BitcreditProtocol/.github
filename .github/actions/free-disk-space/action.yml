name: Free up disk space
description: >
  Reclaim runner disk space before a build that would otherwise run out.
  Prints df -h either side so a failure that is really a full disk is obvious
  in the log rather than a mystery.

runs:
  using: composite
  steps:
    - name: Free up disk space
      shell: bash
      run: |
        echo "Before cleanup:"
        df -h
        docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo apt-get clean
        sudo apt-get autoremove -y
        echo "After cleanup:"
        df -h
